<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" role="img" aria-label="FIA Job Prep logo">
  <defs>
    <linearGradient id="shieldGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="innerGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M60 6 L108 22 L108 66 C108 96 88 122 60 134 C32 122 12 96 12 66 L12 22 Z"
        fill="url(#shieldGradDark)" stroke="#334155" stroke-width="2" filter="url(#softShadowDark)"/>

  <!-- Inner highlight -->
  <path d="M60 14 L100 27 L100 64 C100 90 84 112 60 123 C36 112 20 90 20 64 L20 27 Z"
        fill="url(#innerGradDark)"/>

  <!-- Checkmark -->
  <path d="M36 70 L54 88 L86 52"
        fill="none" stroke="#ffffff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle ring at top -->
  <circle cx="60" cy="22" r="3" fill="#ffffff" opacity="0.85"/>
</svg>
